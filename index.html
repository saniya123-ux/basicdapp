
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Addition DApp</title>
</head>
<body>

    <h1>Addition DApp</h1>

    <button id="connectBtn">Connect MetaMask</button>
    <p id="wallet">Wallet not connected</p>

    <h2>Add Two Numbers</h2>

    <label>First Number:</label>
    <input type="number" id="num1">
    <br><br>

    <label>Second Number:</label>
    <input type="number" id="num2">
    <br><br>

    <button id="addBtn">Add Numbers</button>

    <h2>Result: <span id="result">--</span></h2>


    
<!DOCTYPE html>
<html>
<head>
    <title>Voting DApp</title>
</head>
<body>

    <h1>Voting DApp</h1>
    <p>Blockchain Based Voting System</p>

    <button id="connectBtn">Connect MetaMask</button>
    <p id="wallet">Wallet not connected</p>

    <h2>Choose Your Candidate</h2>

    <button id="vote1">Vote Candidate 1</button>
    <button id="vote2">Vote Candidate 2</button>

    <h2>Voting Results</h2>

    <p>Candidate 1: <span id="votes1">0</span></p>
    <p>Candidate 2: <span id="votes2">0</span></p>

    <button id="refreshBtn">Refresh Results</button>

    <p id="status">Ready to vote</p>

    <script type="module" src="./main.js"></script>

</body>
</html>
